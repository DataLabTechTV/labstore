repos:
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.6.2
    hooks:
      - id: golangci-lint
        name: golangci-lint (backend)
        entry: bash -c "cd backend && golangci-lint run"
        language: system
        types: [go]
      - id: golangci-lint
        name: golangci-lint (cli)
        entry: bash -c "cd cli && golangci-lint run"
        language: system
        types: [go]
      - id: golangci-lint
        name: golangci-lint (client)
        entry: bash -c "cd shared/client && golangci-lint run"
        language: system
        types: [go]
