services:
  web:
    profiles:
      - all
      - labstore
      - testing
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    ports:
      - ${LABSTORE_WEB_PORT}:${LABSTORE_WEB_PORT}
    networks:
      - labstore
      - testing
    environment:
      - S3_ENDPOINT=labstore-server:${LABSTORE_SERVER_S3_ADDRESS_PORT}
      - S3_ACCESS_KEY=${LABSTORE_SERVER_ADMIN_AUTH_ACCESS_KEY}
      - S3_SECRET_KEY=${LABSTORE_SERVER_ADMIN_AUTH_SECRET_KEY}
      - S3_REGION=eu-west-1
      - S3_USE_SSL=false
      - S3_FORCE_PATH_STYLE=true
    restart: unless-stopped

  server:
    profiles:
      - all
      - labstore
      - testing
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    ports:
      - ${LABSTORE_SERVER_ADMIN_ADDRESS_PORT}:${LABSTORE_SERVER_ADMIN_ADDRESS_PORT}
      - ${LABSTORE_SERVER_IAM_ADDRESS_PORT}:${LABSTORE_SERVER_IAM_ADDRESS_PORT}
      - ${LABSTORE_SERVER_S3_ADDRESS_PORT}:${LABSTORE_SERVER_S3_ADDRESS_PORT}
    networks:
      - labstore
    volumes:
      - labstore:/data
      - labstore-keys:/keys
    environment:
      - LABSTORE_SERVER_S3_ADDRESS_HOST=${LABSTORE_SERVER_S3_ADDRESS_HOST}
      - LABSTORE_SERVER_S3_ADDRESS_PORT=${LABSTORE_SERVER_S3_ADDRESS_PORT}
      - LABSTORE_SERVER_ADMIN_AUTH_ACCESS_KEY=${LABSTORE_SERVER_ADMIN_AUTH_ACCESS_KEY}
      - LABSTORE_SERVER_ADMIN_AUTH_SECRET_KEY=${LABSTORE_SERVER_ADMIN_AUTH_SECRET_KEY}
    command: serve --storage-data-dir /data --storage-keys-dir /keys
    restart: unless-stopped

  benchmark-labstore:
    profiles:
      - all
      - benchmark
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    ports:
      - 7787:6787
      - 7788:6788
      - ${BENCHMARK_LABSTORE_PORT:-7789}:6789
    networks:
      - benchmark
    volumes:
      - benchmark-labstore:/data
      - benchmark-labstore-keys:/keys
    environment:
      - LABSTORE_SERVER_ADMIN_AUTH_ACCESS_KEY=${BENCHMARK_STORE_ACCESS_KEY}
      - LABSTORE_SERVER_ADMIN_AUTH_SECRET_KEY=${BENCHMARK_STORE_SECRET_KEY}
    command: serve --s3-server-host 0.0.0.0 --s3-server-port 6789 --storage-data-dir /data --storage-keys-dir /keys
    restart: unless-stopped

  benchmark-minio:
    profiles:
      - all
      - benchmark
      - testing
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - ${BENCHMARK_MINIO_PORT:-9000}:9000
      - 9001:9001
    networks:
      - benchmark
      - testing
    volumes:
      - benchmark-minio:/data
    environment:
      - MINIO_ROOT_USER=${BENCHMARK_STORE_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${BENCHMARK_STORE_SECRET_KEY}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  benchmark-garage:
    profiles:
      - all
      - benchmark
    build:
      context: ..
      dockerfile: infra/Dockerfile.garage
    networks:
      - benchmark
    volumes:
      - benchmark-garage:/var/lib/garage
    ports:
      - ${BENCHMARK_GARAGE_PORT:-3900}:3900
      - 3901:3901
      - 3902:3903
      - 3903:3903
    restart: unless-stopped

  benchmark-seaweedfs:
    profiles:
      - all
      - benchmark
    image: chrislusf/seaweedfs:4.00
    networks:
      - benchmark
    volumes:
      - benchmark-seaweedfs:/data
    ports:
      - 9333:9333
      - 8080:8080
      - 8888:8888
      - ${BENCHMARK_SEAWEEDFS_PORT:-8333}:8333
    environment:
      - AWS_ACCESS_KEY_ID=${BENCHMARK_STORE_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${BENCHMARK_STORE_SECRET_KEY}
    command: server -dir=/data -s3 -s3.port=8333
    restart: unless-stopped

  benchmark-rustfs:
    profiles:
      - all
      - benchmark
    image: rustfs/rustfs:1.0.0-alpha.69
    ports:
      - ${BENCHMARK_RUSTFS_PORT:-10000}:9000
      - 10001:9001
    networks:
      - benchmark
    volumes:
      - benchmark-rustfs:/data
    environment:
      - RUSTFS_ACCESS_KEY=${BENCHMARK_STORE_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${BENCHMARK_STORE_SECRET_KEY}
      - RUSTFS_CONSOLE_ENABLE=true
    restart: unless-stopped

  benchmark-iperf3-server:
    profiles:
      - all
      - benchmark
    image: networkstatic/iperf3
    ports:
      - ${BENCHMARK_IPERF3_PORT:-5201}:5201/tcp
      - ${BENCHMARK_IPERF3_PORT:-5201}:5201/udp
    command: ["-s"]
    restart: unless-stopped

volumes:
  labstore:
  labstore-keys:
  benchmark-labstore:
  benchmark-labstore-keys:
  benchmark-minio:
  benchmark-garage:
  benchmark-seaweedfs:
  benchmark-rustfs:

networks:
  labstore:
  benchmark:
  testing:
