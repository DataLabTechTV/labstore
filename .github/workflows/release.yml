name: release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'testing-*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        include:
          - goos: linux
            goarch: arm
            goarm: 7

    steps:
      - uses: actions/checkout@v6

      - name: setup
        uses: ./.github/actions/setup

      - name: set binary name
        id: binary
        run: |
          BIN="labstore-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) }}"
          [[ "${{ matrix.goos }}" == "windows" ]] && BIN="${BIN}.exe"
          echo "name=$BIN" >> $GITHUB_OUTPUT

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist

          if [ -n "${{ matrix.goarm }}" ]; then
            export GOARM=${{ matrix.goarm }}
          fi

          go build -o dist/${{ steps.binary.outputs.name }} ./cli/cmd/labstore

      - name: generate changelog
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.ref_name }}
          name: Release ${{ github.event.ref_name }}
          body: ${{ steps.changelog.outputs.changes }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
