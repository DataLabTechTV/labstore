name: test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup

      - name: install dependencies (server)
        working-directory: ./server
        run: go mod download

      - name: install dependencies (client)
        working-directory: ./server
        run: go mod download

      - name: install dependencies (cli)
        working-directory: ./cli
        run: go mod download

      - name: go test (server)
        run: go test -v ./server/...

      - name: go test (client)
        run: go test -v ./client/...

      - name: go test (cli)
        run: go test -v ./cli/...
