name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'testing-*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: setup qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: image_tag
        run: |
          repo_lower=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=ghcr.io/${repo_lower}:latest" >> $GITHUB_OUTPUT
          else
            echo "tag=ghcr.io/${repo_lower}:${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

          echo "sha_tag=ghcr.io/${repo_lower}:${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "cache_ref=ghcr.io/${repo_lower}:cache" >> $GITHUB_OUTPUT

      - name: build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: |
            ${{ steps.image_tag.outputs.tag }}
            ${{ steps.image_tag.outputs.sha_tag }}
          cache-from: type=registry,ref=${{ steps.image_tag.outputs.cache_ref }}
          cache-to: type=registry,ref=${{ steps.image_tag.outputs.cache_ref }},mode=max
