name: docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'testing-*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: compute build metadata
        id: meta
        run: |
          repo_lower=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "image_tag=ghcr.io/${repo_lower}:latest" >> $GITHUB_OUTPUT
          else
            echo "image_tag=ghcr.io/${repo_lower}:${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi
          echo "image_cache_tag=ghcr.io/${repo_lower}:cache" >> $GITHUB_OUTPUT

          echo "git_tag=$(git describe --tags --abbrev=0 2>/dev/null)" >> $GITHUB_OUTPUT
          echo "git_commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          build-args: |
            GIT_TAG=${{ steps.meta.outputs.git_tag }}
            GIT_COMMIT=${{ steps.meta.outputs.git_tag }}
          push: true
          tags: ${{ steps.meta.outputs.image_tag }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          cache-from: type=registry,ref=${{ steps.meta.outputs.image_cache_tag }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.image_cache_tag }},mode=max
