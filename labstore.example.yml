server:
  storage:
    data_dir: ./data
    keys_dir: ./keys
  admin:
    address:
      host: 0.0.0.0
      port: 6787
    auth:
      access_key: admin
      secret_key: adminadmin
  iam:
    address:
      host: 0.0.0.0
      port: 6788
    db:
      max_open_conns: 3
      max_idle_conns: 3
      write_chan_cap: 32
      timeout_ms: 5000
      read_cache_size_kib: 65536
      writer_cache_size_kib: 16384
  s3:
    address:
      host: 0.0.0.0
      port: 6789
    paging:
      max_keys: 1000
    io:
      buffer_size: 262144

web:
  address:
    host: 0.0.0.0
    port: 6790

log:
  dir: ./logs

benchmark:
  host: localhost
  ports:
    iperf3: 5201
    labstore: 7789
    minio: 9000
    garage: 3900
    seaweedfs: 8333
    rustfs: 10000
  store:
    access_key: admin
    secret_key: adminadmin
    tls: false
    region: eu-west-1
